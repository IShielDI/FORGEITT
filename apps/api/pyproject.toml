[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeit-api"
version = "0.1.0"
description = "ForgeIt backend: forged by agents, checked by a referee"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "cryptography>=43",
  "anthropic>=0.60",
  "python-multipart>=0.0.9",
  "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.isort]
# The local `alembic/` migrations folder would otherwise make ruff treat the package as first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# TODO(stage-12..18): modules ported as-is from the Referee codebase. They shell out to git/docker
# on purpose (S603/S607) and carry long prompt strings. Harden and drop these ignores stage by stage.
"app/services/**" = ["E501", "E741", "S603", "S607", "B904", "S110", "S112", "N806", "SIM105", "E731", "RUF005", "RUF059", "F841", "S107", "N817"]
"app/routers/rooms.py" = ["E501", "E741", "B904", "RUF005"]
"app/llm/providers.py" = ["E501", "B904"]
"app/core/auth.py" = ["E501"]
"tests/integration/**" = ["S101", "E501", "E741", "F841", "RUF059", "S603", "S607", "S108", "N806", "E731", "RUF005"]
"tests/support/**" = ["E501", "E731"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

# TODO(stage-12..18): untyped modules ported as-is from the Referee codebase. New code stays strict;
# add types and remove a module from this list when its stage is hardened.
[[tool.mypy.overrides]]
module = [
  "app.services.*",
  "app.routers.rooms",
  "app.llm.providers",
  "app.core.auth",
  "app.core.secrets_store",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
